<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ed">
  <title>Work Details · Atlantis Gallery</title>
  <link rel="stylesheet" href="./style.css?release=ember-inline-ride">
  <script type="importmap">
    {"imports": {
      "three": "./src/three/build/three.module.js",
      "three/addons/": "./src/three/examples/jsm/",
      "./src/catalog.js": "./src/catalog.js?release=tiger-dual-20261119",
      "./src/viewer.js": "./src/viewer.js?release=tiger-dual-20261119",
      "./src/vehicle.js": "./src/vehicle.js?release=tiger-dual-20261119",
      "./atlantis-renderer/frontend/webgpu/viewer.js": "./atlantis-renderer/frontend/webgpu/viewer.js?release=storage-limits-20261119",
      "./atlantis-renderer/frontend/webgpu/ocean.js": "./atlantis-renderer/frontend/webgpu/ocean.js?release=storage-limits-20261119",
      "./atlantis-renderer/frontend/webgpu/navigation.js": "./atlantis-renderer/frontend/webgpu/navigation.js?release=tiger-dual-20261119"
    }}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Atlantis Gallery home">
      <span class="mark" aria-hidden="true">A<span>✳</span></span>
      <span>ATLANTIS <b>GALLERY</b></span>
    </a>
  </header>
  <main class="work">
    <a id="back" class="back-link" href="./">← Back to Gallery</a>
    <p id="work-status" class="notice" role="status">Loading work…</p>
    <article id="work" hidden>
      <header class="work-heading">
        <div>
          <h1 id="title"></h1>
          <p>Created by <strong id="creator"></strong></p>
        </div>
        <button id="share" type="button" class="primary">Copy Link</button>
      </header>
      <p id="share-status" class="share-status" role="status" hidden></p>
      <section id="work-social" class="work-social" aria-label="Likes, favorites, and comments" hidden>
        <div id="social-links" class="social-links" hidden>
          <a id="like-work" target="_blank" rel="noopener noreferrer">Like on GitHub</a>
          <a id="favorite-work" target="_blank" rel="noopener noreferrer">Favorite on GitHub</a>
          <a id="comment-work" target="_blank" rel="noopener noreferrer">Comment on GitHub</a>
        </div>
        <p id="social-hint" role="status"></p>
      </section>
      <div class="layout">
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <div id="loading" class="loading">Starting 3D viewer…</div>
          </div>
          <div class="stage-actions">
            <button id="frame" type="button" disabled>Reset View</button>
            <button id="recolor" type="button" disabled>Randomize Colors</button>
            <button id="restore" type="button" disabled>Restore Materials</button>
            <label class="file-button">Open Local Model<input id="file" type="file" accept=".usd,.usda,.usdc,.usdz,.glb,.gltf" disabled></label>
          </div>
          <p id="status" class="status" role="status"></p>
        </div>
        <aside class="details" aria-label="Work details and controls">
          <section id="about-work" class="detail-panel" hidden>
            <h2>About</h2>
            <p id="description"></p>
          </section>
          <section class="detail-panel" id="interaction-panel" hidden>
            <h2>Model Controls</h2>
            <div id="controls"></div>
          </section>
          <section class="detail-panel">
            <h2>Downloads</h2>
            <div id="downloads"></div>
            <div id="isaac-assembly" hidden>
              <label id="isaac-runtime-choice" hidden>Isaac runtime
                <select id="isaac-runtime" aria-label="Isaac runtime">
                  <option value="game">Game Controls (Realtime)</option>
                  <option value="real-physics">Real Physics (PhysX)</option>
                </select>
              </label>
              <button id="assemble-isaac" class="interaction-button" type="button">Tell My Codex To Assemble Isaac</button>
              <p id="isaac-prompt-status" role="status"></p>
              <textarea id="isaac-prompt" aria-label="Isaac Sim assembly prompt" rows="9" readonly hidden></textarea>
            </div>
          </section>
        </aside>
      </div>
    </article>
  </main>
  <script type="module" src="./src/app.js?release=ember-inline-ride"></script>
</body>
</html>
